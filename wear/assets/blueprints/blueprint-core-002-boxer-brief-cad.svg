    <text x="0" y="28">1. Solves #1 Turkish marketplace complaint: leg ride-up</text>
    <text x="0" y="46">   into groin during walking &amp; sitting.</text>
    <text x="0" y="74">2. Tapered thigh opening (21.5 cm half-measure on M) with</text>
