  <text x="50" y="75" fill="#C5A880" font-family="JetBrains Mono, monospace" font-size="10">65% PERUVIAN PIMA COTTON + 27% MICROMODAL + 8% ELASTANE (185 GSM) ? 3-PANEL ANTI-RIDE GUSSET BRIDGE</text>

  <!-- Front Boxer Brief -->
