<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <pattern id="cadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(235,231,223,0.04)" stroke-width="1"/>
    </pattern>
    <style>
      .bg { fill: #0A0B0E; }
      .garment { fill: #15171C; stroke: #EBE7DF; stroke-width: 2; stroke-linejoin: round; }
      .waist { fill: #1D2027; stroke: #EBE7DF; stroke-width: 2; }
      .seam { fill: none; stroke: #C5A880; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .dim { fill: none; stroke: rgba(197,168,128,0.65); stroke-width: 1; }
      .mono { fill: #EBE7DF; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; letter-spacing: 0.08em; }
      .gold { fill: #C5A880; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10.5px; letter-spacing: 0.06em; }
      .muted { fill: #8E8D8A; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; }
    </style>
  </defs>
  <rect width="1200" height="760" class="bg"/>
  <rect width="1200" height="760" fill="url(#cadGrid)"/>

  <!-- Title Block -->
  <rect x="30" y="25" width="1140" height="58" fill="#111318" stroke="rgba(235,231,223,0.2)"/>
  <text x="50" y="48" class="mono">TECH PACK CAD BLUEPRINT // SKU: CORE-001 ? ARCHITECTURAL MID-RISE TRUNK (HERO SKU)</text>
  <text x="50" y="68" class="gold">FABRIC: 92% LENZING MICROMODAL AIR (175 GSM) + 8% ROICA ELASTANE | STITCH: ISO 607 4-NEEDLE 6-THREAD FLATLOCK (13 SPI)</text>

  <!-- FRONT VIEW (Left) -->
  <g transform="translate(80, 125)">
    <text x="195" y="-12" text-anchor="middle" class="mono">01. FRONT CAD VIEW (SIZE M)</text>
    <!-- Waistband (370px wide = 37.0 cm half-waist relaxed) -->
    <rect x="10" y="10" width="370" height="36" class="waist"/>
    <text x="195" y="29" text-anchor="middle" fill="#EBE7DF" font-family="Inter, sans-serif" font-weight="700" font-size="14">core</text>
    <text x="195" y="40" text-anchor="middle" fill="#C5A880" font-family="Inter, sans-serif" font-size="7" letter-spacing="1">an understatement.</text>

    <!-- Trunk Body Outline -->
    <path d="M 10 46 L 0 235 L 145 255 C 165 225, 225 225, 245 255 L 390 235 L 380 46 Z" class="garment"/>

    <!-- 3D Ergonomic Contour Pouch Seams (Flatlock) -->
    <path d="M 135 46 C 125 135, 142 215, 165 240" class="seam"/>
    <path d="M 255 46 C 265 135, 248 215, 225 240" class="seam"/>
    <!-- Center Pouch Dart -->
    <line x1="195" y1="115" x2="195" y2="236" class="seam"/>
    <!-- Anti-Ride Gusset Seam -->
    <path d="M 145 255 Q 195 232 245 255" class="seam"/>
    <!-- Double-Turned Anti-Roll Leg Hem -->
    <line x1="2" y1="223" x2="147" y2="243" class="seam"/>
    <line x1="243" y1="243" x2="388" y2="223" class="seam"/>

    <!-- Dimension Annotations -->
    <line x1="10" y1="-4" x2="380" y2="-4" class="dim"/>
    <text x="195" y="-1" text-anchor="middle" class="gold">WAIST RELAXED: 37.0 CM (STRETCHED: 46.5 CM)</text>

    <line x1="-18" y1="10" x2="-18" y2="235" class="dim"/>
    <text x="-24" y="130" text-anchor="end" class="gold">SIDE: 21.5 CM</text>

    <text x="195" y="102" text-anchor="middle" class="muted">2-PLY CONTOUR</text>
    <text x="195" y="114" text-anchor="middle" class="muted">POUCH (DARTED)</text>
    <text x="195" y="278" text-anchor="middle" class="gold">INSEAM: 7.5 CM ? LEG OPENING: 23.0 CM (HALF)</text>
  </g>

  <!-- BACK VIEW (Right) -->
  <g transform="translate(650, 125)">
    <text x="195" y="-12" text-anchor="middle" class="mono">02. BACK CAD VIEW (NO CENTER-BACK SEAM)</text>
    <rect x="10" y="10" width="370" height="36" class="waist"/>
    <!-- Subtle repeat on back waistband -->
    <text x="195" y="29" text-anchor="middle" fill="rgba(235,231,223,0.35)" font-family="Inter, sans-serif" font-weight="700" font-size="13">core</text>

    <!-- Trunk Body Back -->
    <path d="M 10 46 L 0 235 L 145 258 C 175 248, 215 248, 245 258 L 390 235 L 380 46 Z" class="garment"/>

    <!-- Ergonomic Seat Shaping Seams (Zero-Wedgie Dual Side-Back Panels) -->
    <path d="M 95 46 C 105 140, 120 210, 145 258" class="seam"/>
    <path d="M 295 46 C 285 140, 270 210, 245 258" class="seam"/>
    <line x1="2" y1="223" x2="147" y2="246" class="seam"/>
    <line x1="243" y1="246" x2="388" y2="223" class="seam"/>

    <!-- Interior Tagless Heat-Transfer Print Callout -->
    <rect x="165" y="58" width="60" height="34" fill="none" stroke="rgba(197,168,128,0.6)" stroke-dasharray="2 2"/>
    <text x="195" y="73" text-anchor="middle" class="muted">TAGLESS</text>
    <text x="195" y="84" text-anchor="middle" class="muted">PRINT</text>
    <text x="195" y="278" text-anchor="middle" class="gold">3-PANEL SEAT ARCHITECTURE (ZERO CENTER-SEAM WEDGIE)</text>
  </g>

  <!-- PATTERN PIECES & STITCH BLUEPRINT (Bottom Panel) -->
  <rect x="30" y="445" width="1140" height="285" fill="#111318" stroke="rgba(235,231,223,0.2)"/>
  <text x="50" y="474" class="mono">03. PATTERN PIECES (KALIP PAR?ALARI) &amp; SEWING SPECIFICATION (D?K?M TAL?MATI)</text>

  <!-- Pattern Piece 1: Darted Contour Pouch (x2 Ply) -->
  <g transform="translate(65, 500)">
    <path d="M 25 10 Q 65 0 105 10 C 122 65, 112 130, 65 155 C 18 130, 8 65, 25 10 Z" fill="#181B22" stroke="#C5A880" stroke-width="1.5"/>
    <line x1="65" y1="95" x2="65" y2="155" stroke="#EBE7DF" stroke-dasharray="3 2"/>
    <text x="65" y="65" text-anchor="middle" class="mono">PIECE A</text>
    <text x="65" y="82" text-anchor="middle" class="muted">CONTOUR POUCH</text>
    <text x="65" y="182" text-anchor="middle" class="gold">CUT x2 (DOUBLE PLY)</text>
    <text x="65" y="196" text-anchor="middle" class="muted">GRAINLINE: VERTICAL ?</text>
  </g>

  <!-- Pattern Piece 2: Anti-Chafe Crotch Gusset (x1) -->
  <g transform="translate(245, 520)">
    <path d="M 10 35 Q 85 5 160 35 L 145 105 Q 85 125 25 105 Z" fill="#181B22" stroke="#C5A880" stroke-width="1.5"/>
    <text x="85" y="68" text-anchor="middle" class="mono">PIECE B: GUSSET</text>
    <text x="85" y="84" text-anchor="middle" class="muted">3D CROTCH BRIDGE</text>
    <text x="85" y="162" text-anchor="middle" class="gold">CUT x1 (SELF FABRIC)</text>
    <text x="85" y="176" text-anchor="middle" class="muted">ELIMINATES THIGH RIDE-UP</text>
  </g>

  <!-- Pattern Piece 3: Side-Wrap & Seat Panel (x2) -->
  <g transform="translate(455, 500)">
    <path d="M 10 15 L 185 15 L 195 145 L 5 135 Z" fill="#181B22" stroke="#C5A880" stroke-width="1.5"/>
    <text x="100" y="75" text-anchor="middle" class="mono">PIECE C: WRAP PANEL</text>
    <text x="100" y="92" text-anchor="middle" class="muted">SIDE + BACK SEAT</text>
    <text x="100" y="182" text-anchor="middle" class="gold">CUT x2 (LEFT / RIGHT)</text>
    <text x="100" y="196" text-anchor="middle" class="muted">NO SIDE SEAM ON HIP BONE</text>
  </g>

  <!-- Stitch & Construction Spec Table -->
  <g transform="translate(690, 495)">
    <text x="0" y="18" class="gold">SEWING &amp; CONSTRUCTION MANDATES (AT?LYE D?K?M STANDARTLARI):</text>
    <text x="0" y="42" class="mono">? POUCH &amp; GUSSET SEAMS: ISO 607 (4-Needle 6-Thread Flatlock, 6.0mm width)</text>
    <text x="0" y="62" class="mono">? STITCH DENSITY (SPI): 13 Stitches Per Inch (5.1 stitches / cm)</text>
    <text x="0" y="82" class="mono">? LOOPER THREAD: G?termann Maraflex 120 / Textured Micro-Nylon (Zero Skin Chafe)</text>
    <text x="0" y="102" class="mono">? WAISTBAND ATTACHMENT: ISO 406 3-Needle Bottom Coverstitch + Plush Back Edge</text>
    <text x="0" y="122" class="mono">? WAISTBAND JOIN: Center-Back Ultrasonic Butt-Seam + Micro-Silicone Tape Cover</text>
    <text x="0" y="142" class="mono">? LEG HEM: 15mm Double-Turned Anti-Roll Coverstitch (High-Recovery Elastane)</text>
    <text x="0" y="162" class="mono">? CARE LABEL: Tagless Silicone Heat-Transfer (155?C, 12 sec, 3.5 bar, Cold Peel)</text>
    <text x="0" y="188" class="gold">? QC TOLERANCE: Waist ?0.5 cm | Rise ?0.4 cm | Leg Opening ?0.4 cm</text>
  </g>
</svg>