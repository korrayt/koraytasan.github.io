<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ThinkOnline · icon-pack Klasörü</title>
  <style>
    :root {
      --primary: #00b4c5;
      --bg: #0b0f19;
      --card-bg: #151d30;
      --border: #23314e;
      --text: #f1f5f9;
      --text-muted: #8e9eb5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 40px 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .breadcrumbs { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; font-family: monospace; }
    .breadcrumbs a { color: var(--primary); text-decoration: none; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 22px; font-weight: 700; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .preview { height: 110px; display: flex; align-items: center; justify-content: center; background: #ffffff; background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%), linear-gradient(-45deg, #f1f5f9 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f1f5f9 75%), linear-gradient(-45deg, transparent 75%, #f1f5f9 75%); background-size: 14px 14px; padding: 10px; }
    .preview img { max-height: 80px; max-width: 85%; object-fit: contain; }
    .doc-preview { background: #1e293b; font-size: 36px; }
    .info { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .name { font-weight: 600; font-size: 13px; color: #fff; margin-bottom: 4px; word-break: break-all; }
    .size { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; font-family: monospace; }
    .actions { display: flex; gap: 6px; }
    .btn-sm { flex: 1; display: inline-flex; align-items: center; justify-content: center; padding: 6px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; transition: 0.15s; }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-secondary { background: #1e293b; color: #cbd5e1; border: 1px solid var(--border); }
    .btn-secondary:hover { background: #334155; color: #fff; }
    footer { margin-top: 50px; text-align: center; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumbs">
      <a href="../">thinkonline-assets</a> / <span>icon-pack</span> /
    </div>
    <header>
      <h1>📁 icon-pack/ (1 dosya)</h1>
      <a href="../" style="color: var(--primary); font-size: 13px; text-decoration: none; font-weight: 600;">&larr; Üst Klasöre Dön</a>
    </header>
    <div class="grid">
              <div class="card">
          <div class='preview doc-preview'>📄</div>
          <div class="info">
            <div class="name">LICENSE.txt</div>
            <div class="size">1.1 KB &middot; TXT</div>
            <div class="actions">
              <a class="btn-sm btn-primary" href="LICENSE.txt" target="_blank">Aç</a>
              <a class="btn-sm btn-secondary" href="LICENSE.txt" download>İndir</a>
              <button class="btn-sm btn-secondary" onclick="copyUrl(this, 'LICENSE.txt')">URL Kopyala</button>
            </div>
          </div>
        </div>
    </div>
    <footer>
      <span>ThinkOnline Kurumsal İmza Teslimatı &middot; Koray Taşan Altyapısı</span>
    </footer>
  </div>
  <script>
    function copyUrl(btn, filename) {
      const fullUrl = new URL(filename, window.location.href).href;
      navigator.clipboard.writeText(fullUrl).then(() => {
        const orig = btn.innerText;
        btn.innerText = 'Kopyalandı! ✓';
        btn.style.background = '#10b981';
        btn.style.color = '#fff';
        setTimeout(() => {
          btn.innerText = orig;
          btn.style.background = '';
          btn.style.color = '';
        }, 1500);
      });
    }
  </script>
</body>
</html>
